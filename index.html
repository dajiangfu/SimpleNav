<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简网址导航</title>
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <script src="js/Sortable.min.js" defer></script>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.25);
            --glass-hover: rgba(255, 255, 255, 0.45);
            --panel-bg: rgba(255, 255, 255, 0.9); 
            --accent: #6c5ce7;
            --text-dark: #2d3436;
            --shadow: 0 10px 30px rgba(0,0,0,0.25);
            /* 设定基准宽度以配合缩放 */
            --base-width: 1200px; 
        }

        body {
            margin: 0; 
            height: 100vh; 
            width: 100vw;
            background: #2c3e50 no-repeat center center/cover;
            background-attachment: fixed;
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
            display: flex; 
            justify-content: center; 
            align-items: center;     
            overflow: hidden; 
            user-select: none;
        }

        /* 1. 缩放容器：强制居中 */
        #zoomWrapper {
            display: flex; 
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            width: var(--base-width); /* 固定基准宽度 */
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* 4. 搜索框优化 */
        .search-section { 
            width: 700px; /* 搜索框容器宽度 */
            z-index: 2000; 
            margin-bottom: 60px; 
            position: relative; 
        }
        
        .search-container {
            display: flex; 
            background: rgba(255,255,255,0.95); 
            border-radius: 35px; 
            padding: 6px; /* 搜索框外框高度 */
            box-shadow: var(--shadow); 
            align-items: center; 
            backdrop-filter: blur(10px);
            transition: transform 0.2s;
        }
        .search-container:hover { transform: scale(1.02); }
        
        .engine-select { 
            border: none; 
            background: rgba(0,0,0,0.06); 
            padding: 10px 15px; 
            border-radius: 25px; 
            margin-right: 12px; 
            cursor: pointer; 
            outline: none; 
            font-weight: bold;
            color: #444;
            width: 140px; /* 控制搜索框下拉框宽度 */
            text-align-last: center; 
            font-size: 14px;
            -webkit-appearance: none;
        }
        .engine-select:hover { background: rgba(0,0,0,0.1); }
        .engine-select option { text-align: left; padding: 5px; }

        .search-container input { 
            flex: 1; 
            border: none; 
            background: transparent; 
            padding: 8px; /* 搜索框内部输入框高度 */
            font-size: 12px; /* 字体大小 */
            outline: none; 
            color: #333;
        }

        #searchHints {
            position: absolute; top: 115%; left: 0; width: 100%;
            background: var(--panel-bg); backdrop-filter: blur(20px);
            border-radius: 20px; 
            box-shadow: var(--shadow);
            display: none; 
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px; padding: 15px; box-sizing: border-box;
            max-height: 400px; overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.5);
        }

        /* 3. 主网格：严格的一行10个 */
        .main-grid {
            display: grid; 
            /* 强制10列，每列等宽 */
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 30px 20px; /* 行间距30，列间距20 */
            padding: 20px; 
            width: 100%;
            box-sizing: border-box;
        }
        .main-grid > * {
            min-width: 0;
        }

        /* 7. 分组节点交互 */
        .node-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            cursor: pointer; 
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); 
            position: relative;
        }
        .node-item:hover { transform: translateY(-10px); z-index: 10; }
        
        .icon-sphere {
            width: 85px; height: 85px; /* 图标大小 */
            background: var(--glass);
            backdrop-filter: blur(12px); 
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid rgba(255,255,255,0.5); 
            overflow: hidden; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            transition: all 0.3s;
        }
        .node-item:hover .icon-sphere {
            background: var(--glass-hover);
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            border-color: #fff;
        }

        .icon-sphere img { 
            width: 100%; height: 100%; /* 图片填充比例 */
            object-fit: cover; 
            display: block;
        }
        
        /* 九宫格预览 */
        .preview-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            grid-template-rows: repeat(3, 1fr);
            width: 96%; height: 96%; 
            gap: 1px; padding: 12px; box-sizing: border-box;
        }
        .preview-grid img { 
            width: 100%; height: 100%; 
            border-radius: 30%; 
            object-fit: cover;
        }
        
        .label-text { 
            margin-top: 15px; 
            color: white; 
            font-size: 12px; /* 分组名称文字大小 */
            font-weight: 600; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.7); 
            text-align: center;
            max-width: 110px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* 2. 弹窗防止溢出 */
        #popover {
            position: fixed; 
            background: var(--panel-bg); 
            backdrop-filter: blur(30px) saturate(180%);
            border-radius: 24px; 
            box-shadow: 0 30px 70px rgba(0,0,0,0.5); 
            z-index: 3000; 
            display: none; 
            width: 540px; 
            max-width: calc(100vw - 32px); /* ★ 新增，防极窄屏 */
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.7); 
            box-sizing: border-box;
            opacity: 0; transition: opacity 0.2s;
        }
        
        .pop-header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 20px; padding-bottom: 10px; 
            border-bottom: 1px solid rgba(0,0,0,0.1); 
        }
        .pop-title { font-size: 20px; font-weight: 800; color: var(--text-dark); }
        
        .pop-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); 
            gap: 20px; 
            max-height: 50vh; overflow-y: auto; 
            padding: 5px; 
        }
        .pop-grid::-webkit-scrollbar { width: 5px; }
        .pop-grid::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 3px; }

        .pop-link { 
            display: flex; flex-direction: column; align-items: center; 
            text-decoration: none; color: var(--text-dark); 
            transition: transform 0.2s;
            cursor: pointer;
        }
        .pop-link:hover { transform: translateY(-4px); }

        .pop-icon-box {
            width: 64px; height: 64px; 
            background: #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 8px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.08); 
            overflow: hidden; border: 2px solid #fff;
        }
        .pop-icon-box img { width: 100%; height: 100%; object-fit: cover; }
        .pop-text { font-size: 13px; text-align: center; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }

        /* 右键菜单 */
        #contextMenu {
            position: fixed; display: none; z-index: 9999; 
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            padding: 8px 0; min-width: 160px;
            border: 1px solid rgba(255,255,255,0.6);
            animation: fadeIn 0.1s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .menu-item {
            padding: 10px 20px; font-size: 14px; cursor: pointer; 
            display: flex; align-items: center; gap: 10px; color: #333;
            transition: 0.1s;
        }
        .menu-item:hover { background: var(--accent); color: white; }
        .menu-separator { height: 1px; background: #eee; margin: 4px 0; }

        /* 工具栏 */
        .tools { position: fixed; bottom: 30px; right: 30px; display: flex; gap: 15px; z-index: 4000; }
        .btn-round { 
            width: 50px; height: 50px; border-radius: 50%; border: none; 
            background: rgba(255,255,255,0.2); color: white; cursor: pointer; 
            backdrop-filter: blur(10px); 
            display: flex; align-items: center; justify-content: center; 
            font-size: 22px; transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .btn-round:hover { background: var(--accent); transform: translateY(-5px); box-shadow: 0 10px 25px rgba(108, 92, 231, 0.5); }
        
        /* 提示 */
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: white; padding: 10px 20px;
            border-radius: 50px; font-size: 14px; z-index: 5000;
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="zoomWrapper">
        <div class="search-section">
            <div class="search-container">
                <select class="engine-select" id="engineSelect">
                    <option value="https://www.google.com/search?q=">Google</option>
                    <option value="https://translate.google.com/?sl=auto&tl=zh-CN&text=">翻译成中文</option>
                    <option value="https://translate.google.com/?sl=auto&tl=en&text=">翻译成英语</option>
                    <option value="https://www.bing.com/search?q=">Bing</option>
                    <option value="https://yandex.com/search/?text=">Yandex</option>
                    <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
                </select>
                <input type="text" id="searchInput" placeholder="搜索网络或书签..." autocomplete="off">
            </div>
            <div id="searchHints"></div>
        </div>
        <div class="main-grid" id="mainGrid"></div>
    </div>

    <div id="popover">
        <div class="pop-header">
            <span class="pop-title" id="popTitle">分组名称</span>
            <div style="font-size:12px; color:#888; background:#eee; padding:4px 10px; border-radius:10px;">
                Tip: 右键图标可修改
            </div>
        </div>
        <div class="pop-grid" id="popGrid"></div>
    </div>

    <div id="contextMenu">
        <div class="menu-item" data-action="edit">✏️ 修改信息</div>
        <div class="menu-item" data-action="icon">🖼️ 更换图标</div>
        <div class="menu-separator"></div>
        <div class="menu-item" data-action="delete" style="color:#e74c3c;">🗑️ 删除此项</div>
    </div>

    <div class="tools">
        <button class="btn-round" data-action="import-bookmarks" title="导入Chrome书签">🔖</button>
        <button class="btn-round" data-action="export-config" title="导出配置">📤</button>
        <button class="btn-round" data-action="import-config" title="导入配置">📥</button>
        <button class="btn-round" data-action="change-bg" title="更换壁纸">🎨</button>
        <button class="btn-round" data-action="add-link" title="添加网址">➕</button>
        <button class="btn-round" data-action="repair-all" title="修复全站模糊图标">✨</button>
    </div>
    
    <div class="toast" id="toast">操作成功</div>

    <input type="file" id="fileInput" accept=".html" style="display:none">
    <input type="file" id="configInput" accept=".json" style="display:none">
    <input type="file" id="bgInput" accept="image/*" style="display:none">
    <input type="file" id="iconInput" accept="image/*" style="display:none">
    
    <div id="addLinkPopover" style="display:none; position:fixed; z-index:5000; 
        background: var(--panel-bg); backdrop-filter: blur(20px); padding:20px; border-radius:20px; 
        box-shadow: var(--shadow); width: 400px; max-width: 90vw;">
    
        <div style="margin-bottom:10px; font-weight:bold; font-size:16px;">添加新网址</div>
    
        <!-- 名称输入框：增加高度，统一样式 -->
        <input type="text" id="newLinkName" placeholder="名称" style="width:100%; margin-bottom:10px; padding:12px 8px; border-radius:8px; border:1px solid #ccc; font-size:14px; box-sizing:border-box; height:40px;">
    
        <!-- 网址输入框：增加高度，统一样式 -->
        <input type="text" id="newLinkURL" placeholder="网址 (含 https://)" style="width:100%; margin-bottom:10px; padding:12px 8px; border-radius:8px; border:1px solid #ccc; font-size:14px; box-sizing:border-box; height:40px;">
    
        <!-- 分组选择框：增加高度，统一样式 -->
        <select id="groupSelect" style="width:100%; padding:12px 8px; border-radius:8px; border:1px solid #ccc; margin-bottom:10px; font-size:14px; box-sizing:border-box; height:40px; appearance:none; -webkit-appearance:none; background:white url('data:image/svg+xml;utf8,<svg fill="gray" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>') no-repeat right 8px center; background-size:16px;">
            <!-- 这里会动态生成选项，包括"新建分组" -->
        </select>
    
        <!-- 新建分组输入框：增加高度，统一样式 -->
        <input type="text" id="newGroupName" placeholder="新建分组名称（仅在选择新建时填写）" style="width:100%; margin-bottom:10px; padding:12px 8px; border-radius:8px; border:1px solid #ccc; display:none; font-size:14px; box-sizing:border-box; height:40px;">
    
        <div style="text-align:right; margin-top:20px;">
            <button data-action="cancel-add-link" style="margin-right:10px; padding:8px 16px; border-radius:6px; border:1px solid #ccc; background:#f5f5f5; cursor:pointer;">取消</button>
            <button data-action="confirm-add-link" style="padding:8px 16px; border-radius:6px; border:none; background:var(--accent, #6c5ce7); color:white; cursor:pointer;">添加</button>
        </div>
    </div>
<script src="js/store.js"></script>
<script src="js/Script.js" defer></script>
</body>
</html>
